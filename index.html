<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            text-shadow: 0 0 10px #4ecca3;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #4ecca3;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
        }

        canvas {
            display: block;
            background: #0f0f1a;
            border-radius: 4px;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }

        #controls {
            margin-top: 15px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        #controls kbd {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
            font-family: monospace;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            z-index: 10;
        }

        #overlay.hidden {
            display: none;
        }

        #overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1>🎮 坦克大战 Tank Battle</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <span>❤️ 生命: <span id="health">100</span></span>
            <span>🏆 得分: <span id="score">0</span></span>
            <span>🎯 波次: <span id="wave">1</span></span>
        </div>
        <div id="overlay">
            <h2 id="overlayTitle">准备战斗</h2>
            <p id="overlayText">消灭敌方坦克，生存到最后！</p>
            <button id="startBtn">开始游戏</button>
        </div>
    </div>
    <div id="controls">
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动坦克 &nbsp;|&nbsp; 鼠标瞄准 &nbsp;|&nbsp; 左键射击</p>
        <p>空格键暂停 &nbsp;|&nbsp; 击败敌人获得分数</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthEl = document.getElementById('health');
        const scoreEl = document.getElementById('score');
        const waveEl = document.getElementById('wave');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        // 游戏配置
        const GAME_WIDTH = 900;
        const GAME_HEIGHT = 600;
        const TANK_SIZE = 28;
        const BULLET_SIZE = 5;
        const WALL_SIZE = 40;

        // 游戏状态
        let gameState = 'menu'; // menu, playing, paused, gameover
        let score = 0;
        let wave = 1;
        let lastTime = 0;
        let mouse = { x: GAME_WIDTH / 2, y: GAME_HEIGHT / 2 };

        // 输入状态
        const keys = {};

        // 实体
        let player;
        let enemies = [];
        let bullets = [];
        let walls = [];
        let particles = [];

        // 工具函数
        function distance(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        function angle(from, to) {
            return Math.atan2(to.y - from.y, to.x - from.x);
        }

        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 坦克类
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = TANK_SIZE;
                this.height = TANK_SIZE;
                this.color = color;
                this.isPlayer = isPlayer;
                this.angle = 0;
                this.speed = isPlayer ? 200 : 100 + wave * 8;
                this.health = isPlayer ? 100 : 50 + wave * 15;
                this.maxHealth = this.health;
                this.cooldown = 0;
                this.maxCooldown = isPlayer ? 0.35 : 1.2 - wave * 0.05;
                if (this.maxCooldown < 0.4) this.maxCooldown = 0.4;
                this.barrelLength = 26;
                this.alive = true;
            }

            update(dt) {
                if (this.cooldown > 0) this.cooldown -= dt;

                if (this.isPlayer) {
                    this.updatePlayer(dt);
                } else {
                    this.updateAI(dt);
                }

                // 边界限制
                this.x = Math.max(0, Math.min(GAME_WIDTH - this.width, this.x));
                this.y = Math.max(0, Math.min(GAME_HEIGHT - this.height, this.y));
            }

            updatePlayer(dt) {
                let dx = 0;
                let dy = 0;
                if (keys['w'] || keys['ArrowUp']) dy -= 1;
                if (keys['s'] || keys['ArrowDown']) dy += 1;
                if (keys['a'] || keys['ArrowLeft']) dx -= 1;
                if (keys['d'] || keys['ArrowRight']) dx += 1;

                // 归一化对角线移动
                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx * dx + dy * dy);
                    dx /= len;
                    dy /= len;
                    const nextX = this.x + dx * this.speed * dt;
                    const nextY = this.y + dy * this.speed * dt;
                    if (!this.checkWallCollision(nextX, this.y)) this.x = nextX;
                    if (!this.checkWallCollision(this.x, nextY)) this.y = nextY;
                }

                // 瞄准鼠标
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                this.angle = angle({ x: centerX, y: centerY }, mouse);
            }

            updateAI(dt) {
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;
                const distToPlayer = distance({ x: centerX, y: centerY }, { x: playerCenterX, y: playerCenterY });

                // 瞄准玩家
                this.angle = angle({ x: centerX, y: centerY }, { x: playerCenterX, y: playerCenterY });

                // 保持一定距离移动
                let dx = 0;
                let dy = 0;
                if (distToPlayer > 180) {
                    dx = Math.cos(this.angle);
                    dy = Math.sin(this.angle);
                } else if (distToPlayer < 120) {
                    dx = -Math.cos(this.angle);
                    dy = -Math.sin(this.angle);
                } else {
                    // 侧向移动，避免成为固定靶
                    dx = Math.sin(this.angle);
                    dy = -Math.cos(this.angle);
                }

                const nextX = this.x + dx * this.speed * dt;
                const nextY = this.y + dy * this.speed * dt;
                if (!this.checkWallCollision(nextX, this.y)) this.x = nextX;
                if (!this.checkWallCollision(this.x, nextY)) this.y = nextY;

                // 射击
                if (distToPlayer < 400 && this.cooldown <= 0 && this.hasLineOfSight(player)) {
                    this.shoot();
                }
            }

            hasLineOfSight(target) {
                const start = { x: this.x + this.width / 2, y: this.y + this.height / 2 };
                const end = { x: target.x + target.width / 2, y: target.y + target.height / 2 };
                for (const wall of walls) {
                    if (lineRectIntersect(start, end, wall)) return false;
                }
                return true;
            }

            checkWallCollision(x, y) {
                const rect = { x, y, w: this.width, h: this.height };
                for (const wall of walls) {
                    if (rectIntersect(rect, wall)) return true;
                }
                return false;
            }

            shoot() {
                if (this.cooldown > 0) return;
                this.cooldown = this.maxCooldown;
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;
                const bx = centerX + Math.cos(this.angle) * this.barrelLength;
                const by = centerY + Math.sin(this.angle) * this.barrelLength;
                bullets.push(new Bullet(bx, by, this.angle, this.isPlayer, this.color));
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    this.alive = false;
                    createExplosion(this.x + this.width / 2, this.y + this.height / 2, this.color);
                }
            }

            draw() {
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(this.angle);

                // 炮管
                ctx.fillStyle = '#888';
                ctx.fillRect(0, -4, this.barrelLength, 8);

                // 车身
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

                // 履带细节
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-this.width / 2 + 2, -this.height / 2, 6, this.height);
                ctx.fillRect(this.width / 2 - 8, -this.height / 2, 6, this.height);

                // 炮塔
                ctx.fillStyle = this.isPlayer ? '#6bc4ff' : '#ff9999';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // 血条
                if (this.health < this.maxHealth) {
                    const barWidth = 30;
                    const barHeight = 4;
                    const pct = this.health / this.maxHealth;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(centerX - barWidth / 2, this.y - 10, barWidth, barHeight);
                    ctx.fillStyle = pct > 0.5 ? '#4ecca3' : '#ff6b6b';
                    ctx.fillRect(centerX - barWidth / 2, this.y - 10, barWidth * pct, barHeight);
                }
            }
        }

        // 子弹类
        class Bullet {
            constructor(x, y, angle, isPlayer, color) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = 450;
                this.isPlayer = isPlayer;
                this.color = color;
                this.radius = BULLET_SIZE;
                this.alive = true;
                this.life = 2.5;
            }

            update(dt) {
                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;
                this.life -= dt;

                if (this.life <= 0) this.alive = false;
                if (this.x < 0 || this.x > GAME_WIDTH || this.y < 0 || this.y > GAME_HEIGHT) {
                    this.alive = false;
                }

                // 墙壁碰撞
                for (const wall of walls) {
                    if (this.x >= wall.x && this.x <= wall.x + wall.w &&
                        this.y >= wall.y && this.y <= wall.y + wall.h) {
                        this.alive = false;
                        createSparks(this.x, this.y, '#888', 3);
                        break;
                    }
                }

                // 坦克碰撞
                const targets = this.isPlayer ? enemies : [player];
                for (const target of targets) {
                    if (target.alive &&
                        this.x >= target.x && this.x <= target.x + target.width &&
                        this.y >= target.y && this.y <= target.y + target.height) {
                        this.alive = false;
                        target.takeDamage(this.isPlayer ? 25 : 15);
                        createSparks(this.x, this.y, target.color, 5);
                        break;
                    }
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(this.x - 1, this.y - 1, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 粒子类
        class Particle {
            constructor(x, y, color, speed) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * speed;
                this.life = Math.random() * 0.5 + 0.3;
                this.maxLife = this.life;
                this.size = Math.random() * 3 + 2;
            }

            update(dt) {
                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;
                this.life -= dt;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color, 150));
            }
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y, '#ffaa00', 200));
            }
        }

        function createSparks(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 80));
            }
        }

        // 墙壁和碰撞辅助
        function createWalls() {
            walls = [];
            // 边界内侧装饰墙
            const patterns = [
                { x: 180, y: 150, w: WALL_SIZE * 3, h: WALL_SIZE },
                { x: 180, y: 420, w: WALL_SIZE * 3, h: WALL_SIZE },
                { x: 540, y: 150, w: WALL_SIZE * 3, h: WALL_SIZE },
                { x: 540, y: 420, w: WALL_SIZE * 3, h: WALL_SIZE },
                { x: 360, y: 260, w: WALL_SIZE, h: WALL_SIZE * 2 },
                { x: 70, y: 260, w: WALL_SIZE, h: WALL_SIZE * 2 },
                { x: 790, y: 260, w: WALL_SIZE, h: WALL_SIZE * 2 },
                { x: 360, y: 70, w: WALL_SIZE * 2, h: WALL_SIZE },
                { x: 360, y: 490, w: WALL_SIZE * 2, h: WALL_SIZE }
            ];

            for (const p of patterns) {
                walls.push(p);
            }
        }

        function lineRectIntersect(a, b, rect) {
            const left = lineLineIntersect(a, b, { x: rect.x, y: rect.y }, { x: rect.x, y: rect.y + rect.h });
            const right = lineLineIntersect(a, b, { x: rect.x + rect.w, y: rect.y }, { x: rect.x + rect.w, y: rect.y + rect.h });
            const top = lineLineIntersect(a, b, { x: rect.x, y: rect.y }, { x: rect.x + rect.w, y: rect.y });
            const bottom = lineLineIntersect(a, b, { x: rect.x, y: rect.y + rect.h }, { x: rect.x + rect.w, y: rect.y + rect.h });
            return left || right || top || bottom;
        }

        function lineLineIntersect(a1, a2, b1, b2) {
            const denom = (b2.y - b1.y) * (a2.x - a1.x) - (b2.x - b1.x) * (a2.y - a1.y);
            if (denom === 0) return false;
            const ua = ((b2.x - b1.x) * (a1.y - b1.y) - (b2.y - b1.y) * (a1.x - b1.x)) / denom;
            const ub = ((a2.x - a1.x) * (a1.y - b1.y) - (a2.y - a1.y) * (a1.x - b1.x)) / denom;
            return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
        }

        function spawnEnemies(count) {
            enemies = [];
            const spawnPoints = [
                { x: 50, y: 50 },
                { x: GAME_WIDTH - 80, y: 50 },
                { x: 50, y: GAME_HEIGHT - 80 },
                { x: GAME_WIDTH - 80, y: GAME_HEIGHT - 80 }
            ];

            for (let i = 0; i < count; i++) {
                const spawn = spawnPoints[i % spawnPoints.length];
                let ex = spawn.x + (Math.random() - 0.5) * 60;
                let ey = spawn.y + (Math.random() - 0.5) * 60;

                // 避免在玩家附近生成
                while (distance({ x: ex, y: ey }, { x: player.x, y: player.y }) < 250) {
                    ex = randomRange(50, GAME_WIDTH - 80);
                    ey = randomRange(50, GAME_HEIGHT - 80);
                }

                enemies.push(new Tank(ex, ey, '#e74c3c'));
            }
        }

        function initGame() {
            score = 0;
            wave = 1;
            bullets = [];
            particles = [];
            createWalls();
            player = new Tank(GAME_WIDTH / 2 - TANK_SIZE / 2, GAME_HEIGHT / 2 - TANK_SIZE / 2, '#4ecca3', true);
            spawnEnemies(3);
            updateUI();
        }

        function startGame() {
            initGame();
            gameState = 'playing';
            overlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function nextWave() {
            wave++;
            const enemyCount = Math.min(3 + wave, 12);
            spawnEnemies(enemyCount);
            // 恢复少量生命值
            player.health = Math.min(player.maxHealth, player.health + 20);
            updateUI();
        }

        function gameOver() {
            gameState = 'gameover';
            overlayTitle.textContent = '游戏结束';
            overlayTitle.style.color = '#ff6b6b';
            overlayText.textContent = `最终得分: ${score} | 到达波次: ${wave}`;
            startBtn.textContent = '重新开始';
            overlay.classList.remove('hidden');
        }

        function updateUI() {
            healthEl.textContent = Math.ceil(player.health);
            scoreEl.textContent = score;
            waveEl.textContent = wave;
        }

        function update(dt) {
            if (gameState !== 'playing') return;

            player.update(dt);

            for (const enemy of enemies) {
                enemy.update(dt);
            }

            for (const bullet of bullets) {
                bullet.update(dt);
            }

            for (const particle of particles) {
                particle.update(dt);
            }

            // 清理死亡实体
            bullets = bullets.filter(b => b.alive);
            particles = particles.filter(p => p.life > 0);

            // 处理敌人死亡
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) {
                    score += 100;
                    enemies.splice(i, 1);
                }
            }

            // 检查玩家死亡
            if (!player.alive) {
                gameOver();
            }

            // 下一波
            if (enemies.length === 0 && gameState === 'playing') {
                nextWave();
            }

            updateUI();
        }

        function draw() {
            // 背景
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 网格
            ctx.strokeStyle = 'rgba(78, 204, 163, 0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= GAME_WIDTH; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= GAME_HEIGHT; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.stroke();
            }

            // 墙壁
            ctx.fillStyle = '#4a4a6a';
            ctx.strokeStyle = '#6a6a8a';
            ctx.lineWidth = 2;
            for (const wall of walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
                // 砖块纹理
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(wall.x + 4, wall.y + 4, wall.w - 8, wall.h - 8);
                ctx.fillStyle = '#4a4a6a';
            }

            // 粒子
            for (const particle of particles) {
                particle.draw();
            }

            // 子弹
            for (const bullet of bullets) {
                bullet.draw();
            }

            // 坦克
            for (const enemy of enemies) {
                enemy.draw();
            }
            if (player.alive) player.draw();
        }

        function gameLoop(timestamp) {
            if (gameState === 'playing') {
                const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
                lastTime = timestamp;
                update(dt);
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // 事件监听
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.code === 'Space' && gameState === 'playing') {
                gameState = 'paused';
                overlayTitle.textContent = '暂停';
                overlayTitle.style.color = '#f0c040';
                overlayText.textContent = '按空格键继续';
                startBtn.textContent = '继续游戏';
                overlay.classList.remove('hidden');
            } else if (e.code === 'Space' && gameState === 'paused') {
                gameState = 'playing';
                overlay.classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'playing' && player.alive) {
                player.shoot();
            }
        });

        startBtn.addEventListener('click', () => {
            if (gameState === 'menu' || gameState === 'gameover') {
                startGame();
            } else if (gameState === 'paused') {
                gameState = 'playing';
                overlay.classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        });

        // 初始化画面
        initGame();
        draw();
    </script>
